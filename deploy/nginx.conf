# LiveStream Hub Nginx reverse proxy configuration
# Place at /etc/nginx/sites-available/livestream-hub then symlink to sites-enabled
# Replace stream.example.com with your domain.

# Upstream timeouts - long for streaming and large uploads
proxy_connect_timeout       600s;
proxy_send_timeout          86400s;
proxy_read_timeout          86400s;
send_timeout                86400s;

# Allow unlimited upload size
client_max_body_size        0;
client_body_buffer_size     1M;

server {
    listen 80;
    server_name stream.example.com;

    # Uncomment after certbot obtains the SSL cert and redirect is automatic
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support (real-time stream stats)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for HLS live streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # HLS preview caching
    location /hls/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
        proxy_buffering off;
    }
}

# After running: sudo certbot --nginx -d stream.example.com
# SSL block will be added automatically by certbot.
